name: dbt Slim CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:  

jobs:
  slim-ci:
    runs-on: ubuntu-latest
    
    env:
      DBT_PROFILES_DIR: ./ecommerce_pipeline
      DBT_PROJECT_DIR: ./ecommerce_pipeline
    
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dbt-snowflake
        run: |
          pip install dbt-snowflake==1.11.1
      
      - name: Create profiles.yml
        run: |
          mkdir -p $DBT_PROFILES_DIR
          cat > $DBT_PROFILES_DIR/profiles.yml << EOF
          ecommerce_pipeline:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_USER }}
                password: ${{ secrets.SNOWFLAKE_PASSWORD }}
                role: ${{ secrets.SNOWFLAKE_ROLE }}
                database: ${{ secrets.SNOWFLAKE_DATABASE }}
                warehouse: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
                schema: DBT_CI
                threads: 4
          EOF
      
      - name: Get production manifest from main branch
        run: |
          mkdir -p ./state
          echo "Fetching production manifest from main branch..."
          git fetch origin main
          git show origin/main:ecommerce_pipeline/state/manifest.json > ./state/manifest.json 2>/dev/null || echo "No manifest found"
          
          if [ -f "./state/manifest.json" ]; then
            echo "Production manifest loaded successfully"
            ls -lh ./state/manifest.json
          else
            echo "No production manifest - will run all models"
          fi
      
      - name: Install dbt packages
        run: |
          cd $DBT_PROJECT_DIR
          dbt deps
      
      - name: Run dbt on modified models only
        run: |
          cd $DBT_PROJECT_DIR
          if [ -f "../state/manifest.json" ]; then
            echo "🎯 Running Slim CI - only modified models + downstream"
            dbt run --select state:modified+ --defer --state ../state || dbt run
          else
            echo "⚙️ Running all models - no state available"
            dbt run
          fi
      
      - name: Test modified models only
        run: |
          cd $DBT_PROJECT_DIR
          if [ -f "../state/manifest.json" ]; then
            echo "🧪 Testing modified models only"
            dbt test --select state:modified+ --defer --state ../state || dbt test
          else
            echo "🧪 Testing all models - no state available"
            dbt test
          fi
      
      - name: Generate documentation
        if: success()
        run: |
          cd $DBT_PROJECT_DIR
          dbt docs generate
      
      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-run-artifacts
          path: |
            ecommerce_pipeline/target/run_results.json
            ecommerce_pipeline/target/manifest.json
            ecommerce_pipeline/logs/
