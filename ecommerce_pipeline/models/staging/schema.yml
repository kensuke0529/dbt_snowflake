version: 2

models:
  - name: raw_events_from_s3


  - name: stg_events
    config:
      contract:
        enforced: true

    columns:
      - name: event_at
        data_type: timestamp_ntz
        tests:
          - not_null
          - event_at_is_valid:
              column_name: event_at
              description: "{{doc('event_at_is_valid')}}"
              config:
                severity: warn
        constraints: 
          - type: not_null  

      - name: event_id
        data_type: string
        constraints: 
          - type: not_null
          - type: unique

      - name: session_id
        data_type: string
        constraints: 
          - type: not_null

      - name: customer_id 
        data_type: string
        constraints: 
          -  type: not_null

      - name: order_id
        data_type: string
        constraints: 
          - type: not_null