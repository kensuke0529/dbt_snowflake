version: 2

models:
  - name: int_customer_purchase_history
    description: "Intermediate model for customer purchase history"
    columns:
      - name: customer_id
        description: "Unique identifier for each customer"
        tests:
          - not_null
          - unique
      - name: total_purchases
        description: "Total number of purchases made by the customer"
        tests:
          - not_null
      - name: total_spent
        description: "Total amount spent by the customer"
        tests:
          - not_null
      - name: last_purchase_date
        description: "Date of the most recent purchase made by the customer"
        tests:
          - not_null
